<title>나오 서버 위키</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* 레이아웃: 왼쪽 목차+검색, 오른쪽 문서. 모바일은 목차가 위로 접힘 */
:root{
  --bg:#f3f5f1; --panel:#ffffff; --fg:#1d2a22; --muted:#5d6b62; --line:#d9dfd6;
  --accent:#2f7d4f; --link:#1f6fb5; --accent-soft:#e1f0e6; --code:#e9eee7;
  --r-일반:#6b7770; --r-고급:#2f8f4a; --r-희귀:#2a6fc0; --r-영웅:#8a3fc0; --r-전설:#c07a10;
  --font:'Noto Sans KR',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121815; --panel:#1a221e; --fg:#e4ebe5; --muted:#9aa9a0; --line:#2b362f;
  --accent:#62c28a; --link:#6cb6ff; --accent-soft:#1f3328; --code:#232d27;
  --r-일반:#a3afa8; --r-고급:#62c28a; --r-희귀:#6cb6ff; --r-영웅:#c58cf0; --r-전설:#f0b050; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121815; --panel:#1a221e; --fg:#e4ebe5; --muted:#9aa9a0; --line:#2b362f;
  --accent:#62c28a; --link:#6cb6ff; --accent-soft:#1f3328; --code:#232d27;
  --r-일반:#a3afa8; --r-고급:#62c28a; --r-희귀:#6cb6ff; --r-영웅:#c58cf0; --r-전설:#f0b050; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.75;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:250px minmax(0,1fr);gap:36px;padding-block:24px}
nav{position:sticky;top:16px;align-self:start;max-height:calc(100vh - 32px);overflow:auto;padding-right:6px}
nav .brand{font-size:18px;font-weight:700;color:var(--fg);text-decoration:none;display:block;margin-bottom:10px}
nav .brand span{color:var(--accent)}
.search{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg);font:inherit}
.search:focus,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#res{margin:6px 0 10px;padding:0;list-style:none}
#res li a{display:block;padding:4px 10px;border-radius:6px;font-size:13.5px;color:var(--fg);text-decoration:none}
#res li a:hover{background:var(--accent-soft)}
#res small{color:var(--muted);margin-left:6px}
nav details{margin:2px 0}
nav summary{cursor:pointer;padding:5px 8px;font-weight:700;font-size:13px;color:var(--muted);list-style:none;border-radius:6px}
nav summary:hover{background:var(--accent-soft)}
nav summary::before{content:'▸ ';color:var(--accent)} nav details[open]>summary::before{content:'▾ '}
nav details a{display:block;padding:3px 10px 3px 22px;font-size:13.5px;color:var(--muted);text-decoration:none;border-radius:6px}
nav details a:hover{background:var(--accent-soft);color:var(--fg)}
nav details a.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
main{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px 26px 28px}
.crumb{font-size:12.5px;color:var(--muted);margin-bottom:6px}
.crumb a{color:var(--muted)}
h1{font-size:28px;margin:0 0 14px;letter-spacing:-.02em;text-wrap:balance;padding-bottom:10px;border-bottom:2px solid var(--accent)}
h3{font-size:17px;margin:24px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
h4{margin:12px 0 4px;font-size:14px}
p{margin:0 0 10px} ul,ol{margin:0 0 12px;padding-left:22px} li{margin:2px 0}
a{color:var(--link)}
.lead{color:var(--muted);font-size:16px}
.mut{color:var(--muted);font-size:13px}
code{font-family:var(--mono);font-size:.88em;background:var(--code);padding:1px 6px;border-radius:4px}
.t{border-collapse:collapse;width:max-content;max-width:100%;min-width:50%;font-size:14px;margin:8px 0 14px;display:block;overflow-x:auto}
.t th,.t td{text-align:left;padding:7px 12px;border:1px solid var(--line);vertical-align:top}
.t th{background:var(--code);font-weight:500;font-size:12.5px;color:var(--muted);white-space:nowrap}
.tblwrap{overflow-x:auto}
.infobox{float:right;width:260px;margin:0 0 14px 20px;border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:13.5px;background:var(--panel)}
.infobox .ib-t{background:var(--accent);color:#fff;text-align:center;font-weight:700;padding:7px 10px}
.infobox table{width:100%;border-collapse:collapse}
.infobox th{width:38%;text-align:left;padding:6px 10px;background:var(--code);color:var(--muted);font-weight:500;vertical-align:top}
.infobox td{padding:6px 10px;border-bottom:1px solid var(--line)}
.rar{font-weight:700;white-space:nowrap}
.r-일반{color:var(--r-일반)}.r-고급{color:var(--r-고급)}.r-희귀{color:var(--r-희귀)}.r-영웅{color:var(--r-영웅)}.r-전설{color:var(--r-전설)}
.note{background:var(--accent-soft);border-left:3px solid var(--accent);padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0 14px}
.steps li{margin-bottom:8px}
.back{margin-top:30px;padding-top:12px;border-top:1px solid var(--line);font-size:13.5px;clear:both}
.back b{color:var(--muted);font-size:12px;letter-spacing:.05em}
.back a{margin-right:10px;display:inline-block}
@media (max-width:820px){
  body{padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
  .wrap{gap:8px;padding-block:10px}
  .wrap{grid-template-columns:118px minmax(0,1fr)}
  nav{top:8px;max-height:calc(100vh - 16px);padding-right:2px}
  nav .brand{font-size:14px;margin-bottom:6px;line-height:1.3}
  nav .search{padding:5px 6px;font-size:12px;border-radius:6px}
  nav summary{font-size:12px;padding:5px 4px}
  nav details a{font-size:12px;padding:3px 4px 3px 10px;line-height:1.35;word-break:keep-all;overflow-wrap:anywhere}
  .sub{padding-left:10px;font-size:10px}
  #res li a{font-size:12px;padding:3px 4px}
  .infobox{float:none;width:100%;margin:0 0 14px}
  main{padding:12px 10px 22px;min-width:0}
  main table.t{display:block;overflow-x:auto;max-width:100%;min-width:0;width:auto}
  main h1{font-size:21px}
}
#menubtn{display:none}

.wrap{transition:grid-template-columns .35s cubic-bezier(.4,0,.2,1),column-gap .35s,max-width .35s}
nav{transition:opacity .25s ease,transform .35s cubic-bezier(.4,0,.2,1),visibility 0s linear 0s;padding-top:40px;padding-bottom:60px;min-width:0}
.wrap.collapsed{grid-template-columns:0 minmax(0,1fr);column-gap:0;max-width:1500px}
.wrap.collapsed nav{opacity:0;transform:translateX(-24px);visibility:hidden;pointer-events:none;transition:opacity .2s ease,transform .35s cubic-bezier(.4,0,.2,1),visibility 0s linear .35s;overflow:hidden}
main{padding-top:max(24px,0px)}
.wrap.collapsed main{padding-top:48px}
#railbtn{position:fixed;left:10px;top:10px;z-index:40;display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:inherit;font-size:13px;cursor:pointer;box-shadow:0 1px 4px #0002;transition:background .2s}
#railbtn:hover{background:var(--accent-soft)}
#railbtn i{font-style:normal;display:inline-block;transition:transform .35s}
.wrap.collapsed~#railbtn i{transform:rotate(180deg)}

.ico{display:inline-block;width:24px;height:24px;vertical-align:-6px;margin-right:6px;cursor:pointer;border-radius:4px}
.ico canvas{width:100%;height:100%;image-rendering:pixelated;display:block}
.ico.big{width:64px;height:64px;margin:6px 4px;vertical-align:middle}
.ico:hover,.ico:focus-visible{background:var(--accent-soft)}
.ib-i{text-align:center;background:var(--code);padding:6px 4px}
#mctip{position:fixed;z-index:50;pointer-events:none;max-width:min(320px,calc(100vw - 24px));padding:6px 10px 8px;background:#100010f0;color:#aaa;border:2px solid #2a0a5e;border-radius:3px;box-shadow:0 0 0 1px #100010;font-size:13px;line-height:1.5;display:none}
#mctip .n{font-weight:700;font-size:14px;margin-bottom:2px}
#mctip .sp{height:6px}
#mctip .g{color:#aaaaaa}#mctip .gr{color:#55ff55}#mctip .y{color:#ffaa00}#mctip .a{color:#55ffff}#mctip .b{color:#5555ff}#mctip .p{color:#ff55ff}
#mctip .r-일반{color:#ffffff}#mctip .r-고급{color:#55ff55}#mctip .r-희귀{color:#5599ff}#mctip .r-영웅{color:#d070ff}#mctip .r-전설{color:#ffaa00}
.iconnote{font-size:12.5px;color:var(--muted);margin:2px 0 10px}
.banner{width:100%;height:auto;display:block;image-rendering:pixelated;border-radius:8px;border:1px solid var(--line);margin-bottom:16px}
.ti{display:inline-block;width:16px;height:16px;vertical-align:-3px;margin-right:6px}.ti canvas{width:16px;height:16px;image-rendering:pixelated;display:block}
.hero{display:flex;gap:10px;align-items:center}
.sub{font-size:11px;letter-spacing:.06em;color:var(--muted);padding:8px 10px 2px 22px;text-transform:uppercase;opacity:.8}
.toc{border:1px solid var(--line);border-radius:8px;padding:8px 14px;margin:0 0 14px;font-size:13.5px;background:var(--code)}
.toc b{display:block;color:var(--muted);font-size:12px;margin-bottom:2px}
.toc a{display:inline-block;margin:0 12px 0 0;cursor:pointer}
.pn{display:flex;justify-content:space-between;gap:12px;margin-top:20px;font-size:13.5px;flex-wrap:wrap}
.pn a{padding:6px 12px;border:1px solid var(--line);border-radius:8px;text-decoration:none}
.pn a:hover{background:var(--accent-soft)}
.t td .ico,.t td .ti{vertical-align:-6px}

/* ---- 다듬기 + 화면 전환 ---- */
html{scroll-behavior:smooth}
main{border-radius:14px;box-shadow:0 1px 2px #0000000a,0 8px 24px -12px #00000026}
h1{border-bottom:0;position:relative;padding-bottom:12px}
h1::after{content:'';position:absolute;left:0;bottom:0;height:3px;width:56px;border-radius:3px;background:var(--accent);transition:width .5s cubic-bezier(.2,.8,.2,1)}
main.enter h1::after{animation:grow .6s .1s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{width:0}to{width:56px}}
main a{text-underline-offset:3px;text-decoration-thickness:1px}
.fab{position:fixed;bottom:14px;z-index:40;display:flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:19px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:inherit;font-size:13px;cursor:pointer;box-shadow:0 4px 14px -4px #0000003a;opacity:0;transform:translateY(12px) scale(.96);pointer-events:none;transition:opacity .25s,transform .3s cubic-bezier(.2,.8,.2,1),background .2s}
.fab.show{opacity:1;transform:none;pointer-events:auto}
.fab:hover{background:var(--accent-soft)}
.fab:active{transform:scale(.95)}
#backbtn{left:10px;max-width:46vw}#backbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#topbtn{right:10px;width:38px;padding:0;justify-content:center;font-size:16px}
#prog{position:fixed;top:0;left:0;height:3px;width:0;background:var(--accent);z-index:60;opacity:0;pointer-events:none}
#prog.go{animation:prog .55s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes prog{0%{width:0;opacity:1}70%{width:85%;opacity:1}100%{width:100%;opacity:0}}
main.enter{animation:pgin .45s cubic-bezier(.2,.8,.2,1) both}
main.enter.fwd{--dx:22px}main.enter.bwd{--dx:-22px}
@keyframes pgin{from{opacity:0;transform:translateX(var(--dx,0)) scale(.992);filter:blur(3px)}to{opacity:1;transform:none;filter:none}}
main.enter>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*28ms)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){main.enter,main.enter>*,#prog.go,main.enter h1::after{animation:none!important}html{scroll-behavior:auto}.wrap,nav,.fab{transition:none!important}}
</style>
<div class="wrap">
<nav id="nav" aria-label="목차">
  <a class="brand" href="#home">나오 <span>서버 위키</span></a>
  <input class="search" id="sq" type="search" placeholder="문서 검색 (예: 오스간, 부적)" aria-label="문서 검색" autocomplete="off">
  <ul id="res"></ul>
  <button id="menubtn" type="button" aria-expanded="false">목차 열기</button>
  <div class="tree" id="tree"></div>
</nav>
<main id="main" aria-live="polite"></main>
<div id="prog"></div>
<button id="backbtn" class="fab" type="button" aria-label="이전 문서로"><span>←</span><span id="backtxt">이전 문서</span></button>
<button id="topbtn" class="fab" type="button" aria-label="맨 위로">↑</button>
<button id="railbtn" type="button" aria-label="목차 접기/펴기" aria-expanded="true"><i>◀</i><span id="railtxt">목차</span></button>
</div>
<script>
var DATA={"pages": {"home": {"t": "나오 서버 위키", "c": "시작하기", "h": "\n<p class=\"lead\">서버의 지역, 몹, 장비, 시스템을 문서별로 정리한 위키예요. 본문의 파란 글씨를 누르면 그 문서로 이동해요.<\/p>\n<h3>처음이라면<\/h3>\n<ul><li><a href=\"#tutorial\">처음 시작하는 순서<\/a>: 무엇부터 해야 하는지<\/li><li><a href=\"#commands\">명령어 모음<\/a>: 쓸 수 있는 명령어와 줄임말<\/li><li><a href=\"#menu-clock\">메뉴 시계<\/a>: 핫바 9번 칸<\/li><li><a href=\"#faq\">자주 묻는 질문<\/a> · <a href=\"#patch\">업데이트 내역<\/a><\/li><\/ul>\n<h3>지역<\/h3>\n<ul><li><a href=\"#farm\">파밍 구역<\/a><\/li><li><a href=\"#dungeon\">심연 던전<\/a>: <a href=\"#theme-graveyard\">버려진 지하 묘지<\/a> · <a href=\"#theme-rift\">불타는 균열<\/a> · <a href=\"#theme-frozen\">얼어붙은 심연<\/a> · <a href=\"#theme-swamp\">독안개 늪<\/a> · <a href=\"#theme-void\">공허의 심연<\/a><\/li>\n<li><a href=\"#cave\">지하 대공동<\/a>: <a href=\"#cave-layer-1\">1층 이끼 숲<\/a> · <a href=\"#cave-layer-2\">2층 수정 동굴<\/a> · <a href=\"#cave-layer-3\">3층 지하 호수<\/a> · <a href=\"#cave-layer-4\">4층 고대 유적<\/a> · <a href=\"#cave-layer-5\">5층 균사 늪<\/a><\/li>\n<li><a href=\"#island\">개인 섬과 원정<\/a> · <a href=\"#afk\">잠수 구역<\/a><\/li><\/ul>\n<h3>장비와 아이템<\/h3>\n<ul><li><a href=\"#items\">고유 장비 목록<\/a><\/li><li><a href=\"#class\">클래스<\/a>: <a href=\"#class-mage\">마법사<\/a> · <a href=\"#class-tank\">탱커<\/a> · <a href=\"#class-archer\">아처<\/a> · <a href=\"#class-berserker\">버서커<\/a><\/li>\n<li><a href=\"#talisman\">탈리즈먼(부적)<\/a> · <a href=\"#special-items\">특별 아이템<\/a><\/li><\/ul>\n<h3>경제와 활동<\/h3>\n<ul><li><a href=\"#economy\">코인과 상점<\/a> · <a href=\"#auction\">경매장<\/a> · <a href=\"#repair\">대장장이와 수리<\/a><\/li><li><a href=\"#fishing\">낚시<\/a> · <a href=\"#skills\">스킬과 요리<\/a> · <a href=\"#worldboss\">월드 보스<\/a> · <a href=\"#casino\">슬롯과 잭팟<\/a><\/li><\/ul>\n<h3>몹<\/h3><ul><li><a href=\"#mobs\">몹 도감<\/a><\/li><\/ul>\n", "b": "graveyard", "im": {"t": "grass"}}, "tutorial": {"t": "처음 시작하는 순서", "c": "시작하기", "h": "\n<p class=\"lead\">이 서버는 \"모으고, 팔고, 장비를 맞춰서, 더 깊이 내려가는\" 흐름이에요.<\/p>\n<ol class=\"steps\">\n<li><b><a href=\"#farm\">파밍 구역<\/a>에서 자원을 모아요.<\/b> 5분마다 청크가 통째로 바뀌어서 새 자원이 나와요. 곡괭이가 필요하면 <code>/buy<\/code> 에서 사요.<\/li>\n<li><b>모은 걸 <code>/shop<\/code> 에서 팔아 코인을 벌어요.<\/b> <a href=\"#economy\">코인과 상점<\/a> 참고.<\/li>\n<li><b><a href=\"#guide-npc\">던전 안내원<\/a>에게 기본 장비를 사요.<\/b> <a href=\"#class\">클래스<\/a>를 고르고 맞는 입문 장비를 사요.<\/li>\n<li><b><a href=\"#dungeon\">심연 던전<\/a>에 도전해요.<\/b> 층이 오를수록 세지고 5층마다 보스가 나와요. 죽어도 아이템은 안 잃어요.<\/li>\n<li><b>고유 장비를 모아 강해져요.<\/b> 몹, <a href=\"#mobs\">미니보스<\/a>, 보스가 <a href=\"#items\">고유 장비<\/a>를 떨어뜨려요. 장비가 닳으면 <a href=\"#repair\">대장장이<\/a>에게 맡겨요.<\/li>\n<li><b><a href=\"#cave\">지하 대공동<\/a>으로 내려가요.<\/b> 더 위험하지만 보상이 좋아요. 던전에서 어느 정도 장비를 갖춘 뒤에 가는 걸 권해요.<\/li>\n<li><b>다른 활동으로 폭을 넓혀요.<\/b> <a href=\"#fishing\">낚시<\/a>, <a href=\"#skills\">요리<\/a>, <a href=\"#worldboss\">월드 보스<\/a>, <a href=\"#island\">개인 섬<\/a>이 있어요. 어떤 활동에서든 <a href=\"#talisman\">탈리즈먼<\/a>과 <a href=\"#special-items\">특별 아이템<\/a>이 나올 수 있어요.<\/li>\n<li><b><a href=\"#auction\">경매장<\/a>에서 거래해요.<\/b> 남는 장비는 올리고 필요한 건 사요.<\/li><\/ol>\n<p class=\"note\">길을 잃으면 핫바 9번 칸의 시계를 열어요. <a href=\"#menu-clock\">메뉴 시계<\/a><\/p>", "b": "farm", "im": {"t": "map"}}, "menu-clock": {"t": "메뉴 시계", "c": "시작하기", "h": "<p>핫바 <b>9번 칸의 시계<\/b>가 메인 메뉴예요. <code>/menu<\/code> 로도 열 수 있어요. 파밍, 전투, 경제, 오락, 섬, 설정·기타 같은 카테고리로 나뉘고, 이 서버의 거의 모든 기능이 들어 있어요.<\/p><p>새 기능이 생기면 이 메뉴에도 같이 추가돼요. 엔더상자(9칸), 장비 수리, 탈리즈먼 도감도 여기서 열려요.<\/p>", "b": "void", "im": {"t": "clock"}}, "commands": {"t": "명령어 모음", "c": "시작하기", "h": "<input class=\"search\" id=\"cq\" type=\"search\" placeholder=\"명령어나 설명으로 찾기\" aria-label=\"명령어 검색\"><div class=\"tblwrap\"><table class=\"t\"><tr><th>명령어<\/th><th>설명<\/th><th>줄임말<\/th><\/tr><tr><td><code>/menu<\/code><\/td><td>메뉴 열기 (시계와 같아요)<\/td><td><\/td><\/tr><tr><td><code>/money<\/code><\/td><td>내 코인 확인<\/td><td>/bal /balance<\/td><\/tr><tr><td><code>/pay &lt;플레이어&gt; &lt;금액&gt;<\/code><\/td><td>코인 보내기<\/td><td><\/td><\/tr><tr><td><code>/shop<\/code><\/td><td>판매 상점<\/td><td>/sell<\/td><\/tr><tr><td><code>/buy<\/code><\/td><td>구매 상점 (곡괭이, 귀환 스크롤)<\/td><td>/store<\/td><\/tr , set, price, leaderboard<\/td><td><\/td><\/tr><tr><td><code>/naochunk<\/code><\/td><td>set, reset, list, swap<\/td><td>/naocheck<\/td><\/tr><tr><td><code>/naodiscord<\/code><\/td><td>reload, test, status, send<\/td><td><\/td><\/tr><tr><td><code>/naocave<\/code><\/td><td>setup, generate, confirm, status, npc, tp, boss, raid, resetdata, reload<\/td><td><\/td><\/tr><tr><td><code>/worldboss spawn|end<\/code><\/td><td>월드 보스 소환/종료<\/td><td><\/td><\/tr><tr><td><code>/naoreset<\/code><\/td><td>모든 진행 상황 초기화 (confirm 필요)<\/td><td><\/td><\/tr><\/table><\/div>", "b": "void", "im": {"t": "cmd"}}, "faq": {"t": "자주 묻는 질문", "c": "시작하기", "h": "\n<h3>죽으면 아이템이 사라지나요?<\/h3><p>아니요. 죽어도 아이템은 그대로예요. 던전 안에서 죽어도 마찬가지예요.<\/p>\n<h3>엔더상자는 몇 칸인가요?<\/h3><p>9칸이에요. <a href=\"#menu-clock\">메뉴 시계<\/a>의 엔더상자 버튼으로 열어요.<\/p>\n<h3>탈리즈먼은 같은 걸 여러 개 가질 수 있나요?<\/h3><p>아니요. 종류마다 한 개만 가질 수 있어요. 이미 가진 종류는 줍지도 못하고 드롭도 안 나와요. <a href=\"#talisman\">탈리즈먼<\/a><\/p>\n<h3>광물은 어디에 쓰나요?<\/h3><p>던전 클리어 보상은 코인과 소모품이에요. 광물은 <a href=\"#farm\">파밍 구역<\/a>과 <a href=\"#cave\">지하 대공동<\/a>에서 캐서 <code>/shop<\/code> 에 팔아요.<\/p>\n<h3>장비가 닳으면 어떻게 하나요?<\/h3><p><a href=\"#repair\">대장장이<\/a> NPC나 <code>/repair<\/code> 에서 코인으로 고쳐요.<\/p>\n<h3>경매장에 올릴 수 있는 개수는요?<\/h3><p>제한이 없어요. 팔릴 때 수수료 5%를 떼요. <a href=\"#auction\">경매장<\/a><\/p>\n<h3>지하 대공동에서 횃불을 못 놓아요.<\/h3><p>의도된 거예요. 블록은 사다리만 설치돼요. 랜턴은 <a href=\"#cave-camp\">야영지 상인<\/a>에게서 사서 들고 다녀요.<\/p>\n<h3>보스는 몇 층마다 나오나요?<\/h3><p>5층마다예요. 보스가 없는 층은 마지막 웨이브에 미니보스가 나와요. <a href=\"#dungeon\">심연 던전<\/a><\/p>\n<h3>클래스는 언제 바꾸나요?<\/h3><p><code>/class<\/code> 로 바꿔요. 클래스 전용 장비는 <a href=\"#class\">클래스<\/a> 문서에 있어요.<\/p>\n", "im": {"t": "book"}, "b": "farm"}, "patch": {"t": "업데이트 내역", "c": "시작하기", "h": "<p class=\"mut\">기억나는 범위에서 최대한 정리했어요. 정확한 날짜가 남아 있는 건 최근 것뿐이라, 오래된 건 단계별로 묶었어요.<\/p>\n<h3>2026-11-17<\/h3>\n<ul><li><b>위키 대개편<\/b>: 클래스별 1~50레벨 능력치 표, 스킬 5종 보상표(<a href=\"#xp-table\">경험치 표<\/a>), <a href=\"#cooking\">요리<\/a>, <a href=\"#slot\">슬롯머신 확률<\/a>, <a href=\"#jackpot\">잭팟<\/a>, <a href=\"#fishing\">낚시 어종 33종<\/a>, <a href=\"#worldboss\">월드 보스<\/a>, <a href=\"#dungeon-stats\">던전 스탯<\/a>, 경제 문서를 채웠어요. 모바일에서도 왼쪽에 목차가 떠요.<\/li>\n<li><b>던전 클리어 보상<\/b>을 광물에서 코인과 소모품으로 바꿨어요. 코인은 (40 + 15×층), 보스 층은 ×3이에요. 광물은 직접 캐야 의미가 있으니까요.<\/li>\n<li>룬 골렘 체력을 두 번 조정했어요. 11층에서 800이던 것을 낮췄다가 너무 약해서 다시 올려 최종 1.1배로 맞췄어요.<\/li>\n<li>메리 엄마의 호박파이 드롭 확률을 약 5배 올렸어요.<\/li>\n<li>관리자용 몹 도감 <code>/naomobs<\/code> 를 추가했어요 (던전 몹과 대공동 몹을 층, 정예, 보스 옵션으로 소환).<\/li>\n<li>위키에 아이템 아이콘과 마인크래프트식 설명 툴팁, 몹 얼굴, 장소 배너를 넣었어요.<\/li><\/ul>\n<h3>2026-11-16<\/h3>\n<ul><li><b>대장장이 NPC<\/b>와 <code>/repair<\/code> 를 추가했어요. 닳은 고유 장비를 코인으로 고쳐요.<\/li><li><b><a href=\"#talisman\">탈리즈먼<\/a> 9종<\/b>(생명, 신속, 전사, 수호, 대지, 행운, 밤, 물, 불)을 추가했어요. 던전, 지하 대공동, 월드 보스, 낚시에서 낮은 확률로 나와요.<\/li><li><b>경매장 등록 개수 제한<\/b>을 없앴어요.<\/li><li>이 위키를 열었어요 (명령어, 진행 순서 튜토리얼, 장비, 몹, 지역 문서).<\/li><\/ul>\n<h3>최근 (대공동 · 던전 다듬기)<\/h3>\n<ul><li>지하 대공동 난이도를 조정하고 <b>랜턴<\/b>(어둠 방지)과 <b>방독면<\/b>(독가스 방지)을 야영지 상인에 넣었어요.<\/li><li>던전 일반 몹 · 대공동 몹의 <b>드롭 표를 확인<\/b>할 수 있게 정리했어요.<\/li><li>던전 <b>미니보스<\/b>를 넣고, 보스가 없는 층 마지막 웨이브에 나오게 했어요. 미니보스 전용 장비도 생겼어요.<\/li><li>고유 장비에 <b>내구도<\/b>를 넣었어요 (등급별 400 / 700 / 1,100 / 1,600 / 2,400).<\/li><li>던전에서 <b>죽어도 아이템을 지켜줘요<\/b>. 바닥에 떨어진 아이템도 사라지지 않고 가까운 파티원에게 가요.<\/li><li>던전에 들어가도 <b>야간 투시<\/b>가 유지돼요.<\/li><li><b>엔더상자<\/b>를 9칸으로 제한했어요.<\/li><li>경매장을 <b>창 안에서 판매하기 · 검색<\/b>하도록 바꿨어요. 가격과 검색어는 표지판으로 입력해요.<\/li><li>몹 머리 위 <b>체력 표시<\/b>와 <b>피해량 숫자<\/b>가 나오게 했어요.<\/li><li><b>좀벌레<\/b> 처리를 손봤어요.<\/li><li><b>메리 엄마의 셀프 메이드 호박파이<\/b>를 추가했어요. 얻으면 서버 채팅과 디스코드에 알려요.<\/li><\/ul>\n<h3>시스템 확장<\/h3>\n<ul><li><b>클래스<\/b> 4종(마법사, 탱커, 아처, 버서커)과 스킬 2개(Shift+F, Shift+Q), 마나 시스템, 클래스별 전용 무기와 방어구 세트를 추가했어요.<\/li><li><b>스킬<\/b> 5종(채광, 전투, 요리, 농사, 낚시)을 넣고 레벨업 보상과 영구 보너스를 붙였어요.<\/li><li><b>요리<\/b>로 버프 음식과 낚시 미끼를 만들 수 있게 했어요.<\/li><li><b>낚시<\/b>를 어종 33종, 도감, 어시장 시세, 수족관, 주간 대회, 끌어올리기 미니게임, 바다 괴수와 고유 낚싯대까지 크게 키웠어요.<\/li><li><b>월드 보스<\/b> 레이드를 추가했어요 (매일 20:00).<\/li><li><b>잠수 구역<\/b>과 <b>개인 하늘섬<\/b>, <b>지옥/엔더 원정<\/b>을 추가했어요.<\/li><li><b>슬롯머신<\/b>과 <b>잭팟 추첨<\/b>을 ncient-archer\">고대 사수<\/a><\/li><li><span class=\"ico\" data-t=\"cmob-ruin-wraith\"><\/span><a href=\"#cmob-ruin-wraith\">유적 망령<\/a><\/li><\/ul>", "b": "cave4", "im": {"t": "pillar"}, "g": "지하 대공동"}, "cave-layer-5": {"t": "지하 5층 · 균사 늪", "c": "지역", "h": "<div class=\"infobox\"><div class=\"ib-t\">지하 5층 · 균사 늪<\/div><table><tr><th>코인 배율<\/th><td>×2.2<\/td><\/tr><tr><th>드롭 배율<\/th><td>×1.5<\/td><\/tr><\/table><\/div><p><b>균사 늪<\/b>은(는) <a href=\"#cave\">지하 대공동<\/a>의 5번째 층이에요. 깊을수록 코인과 드롭 확률이 올라가요.<\/p><h3>등장 몹<\/h3><ul><li><span class=\"ico\" data-t=\"cmob-ruin-guard\"><\/span><a href=\"#cmob-ruin-guard\">유적 수호병<\/a><\/li><li><span class=\"ico\" data-t=\"cmob-ancient-archer\"><\/span><a href=\"#cmob-ancient-archer\">고대 사수<\/a><\/li><li><span class=\"ico\" data-t=\"cmob-ruin-wraith\"><\/span><a href=\"#cmob-ruin-wraith\">유적 망령<\/a><\/li><li><span class=\"ico\" data-t=\"cmob-spore-zombie\"><\/span><a href=\"#cmob-spore-zombie\">포자 좀비<\/a><\/li><li><span class=\"ico\" data-t=\"cmob-toxic-spider\"><\/span><a href=\"#cmob-toxic-spider\">독 거미<\/a><\/li><li><span class=\"ico\" data-t=\"cmob-fungus-giant\"><\/span><a href=\"#cmob-fungus-giant\">균사 거인<\/a><\/li><\/ul><h3>보스<\/h3><p>최심부에서 <span class=\"ico\" data-t=\"root-giant\"><\/span><a href=\"#root-giant\">뿌리 거인<\/a>이 깨어나요.<\/p>", "b": "cave5", "im": {"t": "mushroom"}, "g": "지하 대공동"}, "farm": {"t": "파밍 구역", "c": "지역", "h": "<p>스폰 중앙에 있는 자원 채집 구역이에요. <b>5분마다<\/b> 맵 어딘가의 청크를 복사해서 이 구역에 덮어씌워요. 바뀔 때마다 새 광물과 나무가 나오니까 부지런히 캐요.<\/p>\n<ul><li>캔 자원은 <code>/shop<\/code> 에서 팔아요. <a href=\"#economy\">코인과 상점<\/a><\/li><li>구역 아래쪽에는 <a href=\"#cave\">지하 대공동<\/a>이 이어져요.<\/li><li>관리자는 <code>/naochunk<\/code> 로 구역을 설정해요.<\/li><\/ul>", "b": "farm", "im": {"t": "grass"}}, "dungeon": {"t": "심연 던전", "c": "지역", "h": "<p>층을 내려갈수록 어려워지는 무한 하강 던전이에요. 혼자서도, 파티로도 갈 수 있어요.<\/p>\n<h3>진행<\/h3><ul><li>한 층은 여러 웨이브로 이뤄져요.<\/li><li><b>5층마다 보스<\/b>가 나와요.<\/li><li>보스가 없는 층은 <b>마지막 웨이브에 미니보스<\/b>가 나와요.<\/li><li>정예 몹이 섞여 나와요. 더 세지만 드롭이 좋아요.<\/li><li>죽어도 아이템은 사라지지 않아요. 바닥의 아이템도 안 사라지고 가까운 파티원에게 가요.<\/li><li>입장해도 야간 투시가 유지돼요.<\/li><\/ul>\n<h3>테마 (10층마다 바뀜)<\/h3><table class=\"t\"><tr><th>층<\/th><th>테마<\/th><th>보스<\/th><th>미니보스<\/th><\/tr><tr><td>1~10<\/td><td><a href=\"#theme-graveyard\">버려진 지하 묘지<\/a><\/td><td><span class=\"ico\" data-t=\"boss-skeleton-king\"><\/span><a href=\"#boss-skeleton-king\">해골왕 오스간<\/a><\/td><td><span class=\"ico\" data-t=\"mob-mini-grave-captain\"><\/span><a href=\"#mob-mini-grave-captain\">묘지 파수대장<\/a><\/td><\/tr><tr><td>11~20<\/td><td><a href=\"#theme-rift\">불타는 균열<\/a><\/td><td><span class=\"ico\" data-t=\"boss-ignis\"><\/span><a href=\"#boss-ignis\">불꽃의 군주 이그니스<\/a><\/td><td><span class=\"ico\" data-t=\"mob-mini-magma-warden\"><\/span><a href=\"#mob-mini-magma-warden\">마그마 감시자<\/a><\/td><\/tr><tr><td>21~30<\/td><td><a href=\"#theme-frozen\">얼어붙은 심연<\/a><\/td><td><span class=\"ico\" data-t=\"boss-glacia\"><\/span><a href=\"#boss-glacia\">서리 여왕 글라시아<\/a><\/td><td><span class=\"ico\" data-t=\"mob-mini-frost-jailer\"><\/span><a href=\"#mob-mini-frost-jailer\">서리 간수<\/a><\/td><\/tr><tr><td>31~40<\/td><td><a href=\"#theme-swamp\">독안개 늪<\/a><\/td><td><span class=\"ico\" data-t=\"boss-mordum\"><\/span><a href=\"#boss-mordum\">썩은 군주 모르둠<\/a><\/td><td><span class=\"ico\" data-t=\"mob-mini-bog-stalker\"><\/span><a href=\"#mob-mini-bog-stalker\">늪지 포식자<\/a><\/td><\/tr><tr><td>41~50<\/td><td><a href=\"#theme-void\">공허의 심연<\/a><\/td><td><span class=\"ico\" data-t=\"boss-abyss\"><\/span><a href=\"#boss-abyss\">심연의 지배자 아비스<\/a><\/td><td><span class=\"ico\" data-t=\"mob-mini-void-herald\"><\/span><a href=\"#mob-mini-void-herald\">공허 전령<\/a><\/td><\/tr><\/table>\n<p>50층이 지나면 처음 테마부터 더 강한 \"재앙\" 단계로 반복돼요.<\/p>\n<h3>명령어<\/h3><div class=\"tblwrap\"><table class=\"t\"><tr><th>명령어<\/th><th>설명<\/th><th>줄임말<\/th><\/tr><tr><td><code>/dungeon<\/code><\/td><td>던전 메뉴<\/td><td>/dg<\/td><\/tr><tr><td><code>/dungeon join · start · leave<\/code><\/td><td>파티 참가 · 시작 · 나가기<\/td><td><\/td><\/tr><tr><td><code>/dungeon list<\/code><\/td><td>진행 중인 파티<\/td><td><\/td><\/tr><tr><td><code>/dungeon stats<\/code><\/td><td>스탯 강화<\/td><td><\/td><\/tr><tr><td><code>/dungeon top<\/code><\/td><td>기록 순위<\/td><td><\/td><\/tr><\/table><\/div>\n<h3>일반 층 클리어 보상<\/h3><p>일반 층을 깰 때 낮은 확률로 기본 장비가 나와요: <span class=\"ico\" data-t=\"zombie_sword\"><\/span><a href=\"#item-zombie-sword\">좀비 검<\/a>, <span class=\"ico\" data-t=\"leaping_sword\"><\/span><a href=\"#item-leaping-sword\">도약의 검<\/a>, <span class=\"ico\" data-t=\"aspect_end\"><\/span><a href=\"#item-aspect-end\">종말의 검<\/a> · <span class=\"ico\" data-t=\"zombie_soldier_helmet\"><\/span><a href=\"#set-zombie-soldier\">좀비 병사 세트<\/a><\/p>", "b": "rift", "im": {"t": "portal"}}, "cave": {"t": "지하 대공동", "c": "지역", "h": "<p>파밍 구역 아래에 도넛 모양으로 이어지는 별도 월드 \"naocave\"예요. 층별 동굴, 광맥, 몹, 보스, 습격, 어둠, 독가스가 있어요.<\/p>\n<h3>층<\/h3><table class=\"t\"><tr><th>층<\/th><th>이름<\/th><th>코인<\/th><th>드롭<\/th><\/tr><tr><td>1<\/td><td><a href=\"#cave-layer-1\">이끼 숲<\/a><\/td><td>×0.4<\/td><td>×0.5<\/td><\/tr><tr><td>2<\/td><td><a href=\"#cave-layer-2\">수정 동굴<\/a><\/td><td>×0.7<\/td><td>×0.7<\/td><\/tr><tr><td>3<\/td><td><a href=\"#cave-layer-3\">지하 호수<\/a><\/td><td>×1<\/td><td>×1<\/td><\/tr><tr><td>4<\/td><td><a href=\"#cave-layer-4\">고대 유적<\/a><\/td><td>×1.5<\/td><td>×1.2<\/td><\/tr><tr><td>5<\/td><td><a href=\"#cave-layer-5\">균사 늪<\/a><\/td><td>×2.2<\/td><td>×1.5<\/td><\/tr><\/table>\n<ul><li>블록은 <b>사다리만<\/b> 설치돼요. 횃불과 랜턴은 들고만 다녀요.<\/li><li>정예 몹이 많이 나와요 (기본 30%).<\/li><li>최심부에는 보스 <span class=\"ico\" data-t=\"root-giant\"><\/span><a href=\"#root-giant\">뿌리 거인<\/a>이 있어요.<\/li><li><a href=\"#cave-camp\">야영지 상인<\/a>에게서 랜턴, 방독면, 갈고리 밧줄을 살 수 있어요.<\/li><li>곳곳에 <a href=\"#cave-vault\">보물 금고<\/a>가 있어요.<\/li><\/ul>\n<h3>명령어<\/h3><div class=\"tblwrap\"><table class=\"t\"><tr><th>명령어<\/th><th>설명<\/th><th>줄임말<\/th><\/tr><tr><td><code>/cave<\/code><\/td><td>지하 대공동으로 내려가기<\/td><td><\/td><\/tr><tr><td><code>/cave up<\/code><\/td><td>올라가기<\/td><td><\/td><\/tr><tr><td><code>/cave info<\/code><\/td><td>층 목록, 내 기록, 보스 상태<\/td><td><\/td><\/tr><\/table><\/div>", "b": "cave", "im": {"t": "pick"}}, "island": {"t": "개인 섬과 원정", "c": "지역", "h": "<h3>개인 하늘섬<\/h3><p>플레이어마다 작은 섬을 가지고 꾸미고 농사를 짓는 곳이에요. 몹은 자연 소환되지 않아요. 농사로 <a href=\"#cooking\">요리<\/a> 재료를 키워요.<\/p><ul><li><code>/island<\/code>: 내 섬으로 가요.<\/li><li><code>/island visit &lt;이름&gt;<\/code>: 누구든 구경(방문)할 수 있어요.<\/li><li><code>/island trust<\/code> / <code>untrust<\/code>: 건축 허락을 주고 거둬요.<\/li><\/ul><div class=\"tblwrap\"><table class=\"t\"><tr><th>항목<\/th><th>값<\/th><\/tr><tr><td>섬 반지름<\/td><td>6칸<\/td><\/tr><tr><td>건축 가능 범위<\/td><td>중심에서 가로 24칸<\/td><\/tr><tr><td>방문<\/td><td>누구나 가능, 건축은 주인이 허락한 사람만<\/td><\/tr><tr><td>월드<\/td><td>naoisland<\/td><\/tr><\/table><\/div>\n<h3>지옥/엔더 원정<\/h3><p>코인을 내면 지옥(또는 엔더) 월드의 <b>무작위 청크 하나<\/b>로 이동해서 제한 시간 동안 그 청크 안에서만 캘 수 있어요. 시간이 끝나면 스폰으로 돌아와요. 원정 중 죽으면 아이템을 잃어요. 일반 지옥/엔더 포탈은 막혀 있어요.<\/p><div class=\"tblwrap\"><table class=\"t\"><tr><th><\/th><th>지옥 (<code>/expedition nether<\/code>)<\/th><th>엔더 (<code>/expedition end<\/code>)<\/th><\/tr><tr><td>비용<\/td><td>500 코인<\/td><td>1,500 코인<\/td><\/tr><tr><td>시간<\/td><td>300초(5분)<\/td><td>300초(5분)<\/td><\/tr><tr><td>무작위 범위<\/td><td>월드 중심에서 3,000블록<\/td><td>중앙 섬 바깥(1,200블록~4,500블록)<\/td><\/tr><tr><td>구조물 청크<\/td><td>25% 확률 (요새·보루)<\/td><td>25% 확률 (엔드 시티)<\/td><\/tr><\/table><\/div><p><code>/expedition leave<\/code> 로 일찍 나오고, <code>/spawn<\/code> 으로 스폰에 돌아와요. <a href=\"#farm\">파밍 구역<\/a> 안에서는 섬·원정·던전으로 못 가요. 귀환 스크롤로 먼저 빠져나오세요.<\/p>", "b": "island", "im": {"t": "island"}}, "afk": {"t": "잠수 구역", "c": "지역", "h": "<p>가만히 있기만 해도 코인이 들어오는 곳이에요. <code>/afk<\/code> 로 이동하고 규칙도 볼 수 있어요. 관리자는 <code>/afkzone create &lt;이름&gt; [반경]<\/code> 으로 구역을 만들어요.<\/p><div class=\"tblwrap\"><table class=\"t\"><tr><th>항목<\/th><th>값<\/th><\/tr><tr><td>보상 주기<\/td><td>10초마다 10 코인<\/td><\/tr><tr><td>분당<\/td><td>60 코인<\/td><\/tr><tr><td>시간당<\/td><td>3,600 코인<\/td><\/tr><tr><td>하루 상한<\/td><td>없음 (기본)<\/td><\/tr><tr><td>안전<\/td><td>구역 안에서는 모든 피해를 안 받고 배고프지도 않아요<\/td><\/tr><tr><td>구역 크기<\/td><td>기본 반경 6칸, 아래 3칸, 위 12칸<\/td><\/tr><\/table><\/div><p class=\"mut\">던전 1~10층을 도는 수익(분당 45~60코인)과 비슷하게 맞춰 놨어요. 던전은 장비와 경험치까지 나오니까 던전이 더 이득이에요.<\/p>", "b": "afk", "im": {"t": "bed"}}, "class-mage": {"t": "마법사", "c": "시스템", "h": "<p><b>마법사<\/b> 클래스 전용 장비예요. <a href=\"#class\">클래스<\/a>에서 마법사를 고르면 이 장비의 스킬을 제대로 쓸 수 있어요.<\/p><p>마나를 써서 지팡이로 주문을 쏘는 원거리 딜러.<\/p><h3>스킬<\/h3><div class=\"tblwrap\"><table class=\"t\"><tr><th>키<\/th><th>이름<\/th><th>효과<\/th><th>재사용 대기<\/th><\/tr><tr><td>Shift+F 또는 <code>/class skill1<\/code><\/td><td>비전 폭발<\/td><td>주변 6칸의 적을 밀어내며 피해 (마나 30)<\/td><td>10초<\/td><\/tr><tr><td>Shift+Q 또는 <code>/class skill2<\/code><\/td><td>운석 낙하<\/td><td>바라보는 곳에 운석 10개를 퍼부어요 (마나 80)<\/td><td>60초<\/td><\/tr><\/table><\/div><h3>레벨 올릴 때 받는 능력치<\/h3><p>마나로 싸우는 유리대포. 최대 체력이 하트 2칸 줄지만 레벨마다 마나, 마나 재생, 주문 피해가 늘어요. 주문을 4초 안에 연속으로 쓰면 시전마다 마나 비용이 12%씩 늘어 최대 +60%까지 올라가고, 주문을 쓴 직후 1.5초는 마나가 차지 않아요.<\/p><p>클래스 경험치는 몹을 잡을 때 <b>체력 ÷ 4<\/b>(최소 1, 최대 150)만큼 들어와요. 예를 들어 체력 20짜리 몹은 5, 체력 200 이상은 50, 600 이상은 150이에요. 클래스를 처음 고를 때는 무료이고 바꿀 때는 500 코인이 들어요. 클래스별 레벨은 따로 저장되니까 다시 돌아오면 그대로예요.<\/p><h3>1~50레벨 능력치 표<\/h3><div class=\"tblwrap\"><table class=\"t\"><tr><th>레벨<\/th><th>누적 XP<\/th><th>최대 마나<\/th><th>마나 재생(최대 마나의 %/초)<\/th><th>주문 피해<\/th><th>최대 체력<\/th><\/tr><tr><td>1<\/td><td>40<\/td><td>103<\/td><td>10.1%<\/td><td>+0.7%<\/td><td>-4 (하트 2칸)<\/td><\/tr><tr><td>2<\/td><td>153<\/td><td>106<\/td><td>10.2%<\/td><td>+1.4%<\/td><td>-4 (하트 2칸)<\/td><\/tr><tr><td>3<\/td><td>361<\/td><td>109<\/td><td>10.3%<\/td><td>+2.1%<\/td><td>-4 (하트 2칸)<\/td><\/tr><tr><td>4<\/td><td>681<\/td><td>112<\/td><td>10.4%<\/td><td>+2.8%<\/td><td>-4 (하트 2칸)<\/td><\/tr><tr><td>5<\/td><td>1,128<\/td><td>115<\/td><td>10.5%<\/td><td>+3.5%<\/td><td>-4 (하트 2칸)<\/td><\/tr><tr><td>6<\/td><td>1,716<\/td><td>118<\/td><td>10.6%<\/td><td>+4.2%<\/td><td>-4 (하트 2칸)<\/td><\/tr><tr><td>7<\/td><td>2,457<\/td><td>121<\/td><td>10.7%<\/td><td>+4.9%<\/td><td>-4 (하트 2칸)<\/td><\/tr><tr><td>8<\/td><td>3,362<\/td><td>124<\/td 장", "c": "시스템", "h": "<p>판매자가 정한 가격에 바로 사는 방식이에요. 제한 시간이 없고, 등록 개수 제한도 없어요.<\/p><ul><li><code>/auction<\/code> (<code>/ah<\/code>)으로 열어요. 창 안의 <b>판매하기<\/b>와 <b>검색<\/b> 버튼을 쓰고, 가격과 검색어는 표지판에 적어서 입력해요.<\/li><li>팔리면 <b>수수료 5%<\/b>를 떼고 판매자에게 지급돼요. 10,000에 팔면 9,500을 받아요.<\/li><li>취소는 <code>/auction mine<\/code> 에서 해요. 경매원 NPC(<code>/naonpc spawn auction<\/code>)에게 우클릭해도 열려요.<\/li><\/ul><h3>팁<\/h3><ul><li><a href=\"#items\">고유 장비<\/a>, <a href=\"#talisman\">탈리즈먼<\/a>처럼 직접 팔기 어려운 아이템이 거래돼요.<\/li><li>가격을 정하기 전에 같은 물건이 얼마에 올라와 있는지 검색해 보세요.<\/li><li><a href=\"#fishing\">물고기<\/a>는 어시장 시세가 좋은 날 직접 파는 게 나아요.<\/li><\/ul>", "b": "farm", "im": {"t": "trunk"}}, "repair": {"t": "대장장이와 수리", "c": "시스템", "h": "<p>대장장이 NPC에게 우클릭하거나 <code>/repair<\/code> 를 쓰면 수리 창이 열려요. 인벤토리, 방어구, 보조손에서 닳은 장비만 나와요. 하나씩 클릭하거나 <b>전부 수리<\/b>로 한 번에 고쳐요.<\/p>\n<p>수리비 = <code>닳은 내구도 × 0.25 × 등급 배율<\/code><\/p><table class=\"t\"><tr><th>일반<\/th><th>고급<\/th><th>희귀<\/th><th>영웅<\/th><th>전설<\/th><th>일반 아이템<\/th><\/tr><tr><td>×0.6<\/td><td>×1<\/td><td>×1.6<\/td><td>×2.5<\/td><td>×4<\/td><td>×0.5<\/td><\/tr><\/table>", "b": "rift", "im": {"t": "anvil"}}, "fishing": {"t": "낚시", "c": "시스템", "h": "<p>어디서든 낚싯대를 던져 고유 어종 <b>33종<\/b>을 잡을 수 있어요. 물고기는 크기(cm)와 무게(kg)가 있고, 도감·기록·어시장·수족관·주간 대회까지 이어져요. 명령어는 <code>/fishing<\/code> (도감, 시세, 기록, 대회), <code>/aquarium<\/code> 이에요. (<a href=\"#skill-fishing\">낚시 스킬 보상표<\/a>)<\/p>\n<h3>잡는 법<\/h3><ul><li>낚싯대를 던져 입질이 오면 당겨요. <b>희귀 이상<\/b> 물고기가 걸리면 끌어올리기 미니게임이 시작돼요.<\/li><li>왼손에 <a href=\"#cooking\">미끼<\/a>를 들고 던지면 1개를 써서 효과를 받아요.<\/li><li>잡는 장소(섬 연못, 호수, 강, 바다, 심해, 늪, 얼음, 지하 호수, 공허)와 시간(낮/밤/비)에 따라 나오는 어종이 달라요.<\/li><\/ul>\n<h3>어종 등급 확률 (기본)<\/h3><div class=\"tblwrap\"><table class=\"t\"><tr><th>등급<\/th><th>가중치<\/th><th>기본 판매가<\/th><\/tr><tr><td>일반<\/td><td>60<\/td><td>2<\/td><\/tr><tr><td>고급<\/td><td>25<\/td><td>8<\/td><\/tr><tr><td>희귀<\/td><td>10<\/td><td>30<\/td><\/tr><tr><td>영웅<\/td><td>4<\/td><td>100<\/td><\/tr><tr><td>전설<\/td><td>1<\/td><td>400<\/td><\/tr><\/table><\/div><p class=\"mut\">그 장소에서 나올 수 있는 등급끼리만 비교해요. 희귀 이상은 미끼·낚싯대·인챈트(바다의 행운 레벨당 +5%)·수족관 보너스만큼 가중치가 늘어요.<\/p>\n<h3>어종 33종<\/h3><div class=\"tblwrap\"><table class=\"t\"><tr><th>어종<\/th><th>등급<\/th><th>크기<\/th><th>서식지<\/th><th>조건<\/th><th>기본가<\/th><\/tr><tr><td>붕어<\/td><td>일반<\/td><td>15~40cm<\/td><td>섬 연못, 호수, 늪<\/td><td>언제든<\/td><td>2<\/td><\/tr><tr><td>잉어<\/td><td>일반<\/td><td>30~80cm<\/td><td>섬 연못, 호수, 강<\/td><td>언제든<\/td><td>2<\/td><\/tr><tr><td>미꾸라지<\/td><td>일반<\/td><td>8~25cm<\/td><td>섬 연못, 늪, 강<\/td><td>언제든<\/td><td>2<\/td><\/tr><tr><td>메기<\/td><td>일반<\/td><td>30~90cm<\/td><td>호수, 강, 늪<\/td><td>언제든<\/td><td>2<\/td><\/tr><tr><td>고등어<\/td><td>일반<\/td><td>25~50cm<\/td><td>바다<\/td><td>언제든<\/td><td>2<\/td><\/tr><tr><td>갈치<\/td><td>일반<\/td><td>60~150cm<\/td><td>바다<\/td><td>언제든<\/td><td>2<\/td><\/tr><tr><td>빙어<\/td><td>일반<\/td><td>8~20cm<\/td><td>얼음<\/td><td>언제든<\/td><td>2<\/td><\/tr><tr><td>동굴 피라미<\/td><td>일반<\/td><td>6~18cm<\/td><td>지하 호수<\/td><td>언제든<\/td><td>2<\/td><\/tr><tr><td>금붕어<\/td><td>고급<\/td><td>5~20cm<\/td><td>섬 연못<\/td><td>언제든<\/td><td>8<\/td><\/tr><tr><td>송어<\/td><td>고급<\/td><td>30~70cm<\/td><td>강, 호수, 얼음<\/td><td>언제든<\/td><td>8<\/td><\/tr><tr><td>장어<\/td><td>고급<\/td><td>40~120cm<\/td><td>강, 늪, 호수<\/td><td>언제든<\/td><td>8<\/td><\/tr><tr><td>은어<\/td><td>고급<\/td><td>15~30cm<\/td><td>강<\/td><td>낮<\/td><td>8<\/td><\/tr><tr><td>참치<\/td><td>고급<\/td><td>80~250cm<\/td><td>바다<\/td><td>언제든<\/td><td>8<\/td><\/tr><tr><td>가오리<\/td><td>고급<\/td><td>50~150cm<\/td><td>바다<\/td><td>언제든<\/td><td>8<\/td><\/tr><tr><td>복어<\/td><td>고급<\/td><td>15~45cm<\/td><td>바다, 심해<\/td><td>언제든<\/td><td>8<\/td><\/tr><tr><td>얼음 송어<\/td><td>고급<\/td><td>30~65cm<\/td><td>얼음<\/td><td>언제든<\/td><td>8<\/td><\/tr><tr><td>장님물고기<\/td><td>고급<\/td><td>8~20cm<\/td><td>지하 호수<\/td><td>언제든<\/td><td>8<\/td><\/tr><tr><td>늪 메기<\/td><td>고급<\/td><td>40~110cm<\/td><td>늪<\/td><td>언제든<\/td><td>8<\/td><\/tr><tr><td>쏘가리<\/td><td>희귀<\/td><td>30~70cm<\/td><td>호수, 강<\/td><td>언제든<\/td><td>30<\/td><\/tr><tr><td>황금잉어<\/td><td>희귀<\/td><td>40~9     for(var y=0;y<H;y++)P(0,y,W,1,lerp(sc.t[0],sc.t[1],y/H));
    var fy=H-6;
    for(var tx=0;tx<W;tx+=4)for(var ty=fy;ty<H;ty+=3)P(tx,ty,4,3,((tx/4+(ty-fy)/3)&1)?sc.a[0]:sc.a[1]);
    var d=sc.d,i,xx;
    if(d==='pillars'){for(i=0;i<5;i++){xx=8+i*20+Math.floor(R()*6);var ph=8+Math.floor(R()*8);P(xx,fy-ph,4,ph,sc.acc);P(xx-1,fy-ph,6,2,'#bdb9a4');P(xx+3,fy-ph+2,1,ph-2,'#9a977f')}for(i=0;i<9;i++)P(Math.floor(R()*W),Math.floor(R()*(fy-4)),1,1,sc.glow)}
    if(d==='lava'){for(i=0;i<5;i++){xx=Math.floor(R()*W);P(xx,fy+1,10+Math.floor(R()*8),1,sc.acc);P(xx+2,fy+2,6,1,sc.glow)}P(30,fy+3,26,3,'#e8651a');P(34,fy+3,16,1,'#ffcc66');for(i=0;i<16;i++)P(Math.floor(R()*W),Math.floor(R()*fy),1,1,R()<.5?sc.acc:sc.glow);for(i=0;i<4;i++){xx=6+i*24;P(xx,fy-9,5,9,'#1a1413');P(xx+1,fy-11,3,2,'#1a1413')}}
    if(d==='ice'){for(i=0;i<9;i++){xx=4+i*11;var h=5+Math.floor(R()*9);for(var r=0;r<h;r++)P(xx+Math.floor(r/3),fy-r,Math.max(1,4-Math.floor(r/2)),1,sc.acc);}for(i=0;i<30;i++)P(Math.floor(R()*W),Math.floor(R()*fy),1,1,'#fff')}
    if(d==='shroom'){for(i=0;i<6;i++){xx=6+i*16+Math.floor(R()*5);var hh=4+Math.floor(R()*7);P(xx+1,fy-hh,2,hh,'#e8dcc0');P(xx-2,fy-hh-3,8,3,sc.acc);P(xx,fy-hh-2,1,1,'#fff');P(xx+3,fy-hh-2,1,1,'#fff')}for(i=0;i<14;i++)P(Math.floor(R()*W),Math.floor(R()*fy),1,1,sc.glow);x.globalAlpha=.18;P(0,fy-6,W,4,'#cfe8b0');x.globalAlpha=1}
    if(d==='void'){x.globalAlpha=.5;for(i=6;i>0;i--)P(48-i*7,3+i,i*14,1,'#7a3ad8');x.globalAlpha=1;P(40,6,16,12,'#07030d');P(42,8,12,8,'#6a2ad0');P(45,10,6,4,'#d8b0ff');for(i=0;i<22;i++)P(Math.floor(R()*W),Math.floor(R()*fy),1,1,R()<.5?sc.acc:sc.glow);for(i=0;i<4;i++){xx=6+i*28;P(xx,fy-6,6,6,'#2a1a3a');P(xx+1,fy-7,4,1,'#c79dff')}}
    if(d==='ladder'){for(i=0;i<3;i++){xx=14+i*30;P(xx,2,1,fy-2,'#8a5a2b');P(xx+4,2,1,fy-2,'#8a5a2b');for(var r2=4;r2<fy;r2+=3)P(xx,r2,5,1,'#a8743a')}P(70,fy-4,4,4,'#f5cf47');P(71,fy-3,2,2,'#fff3a0');P(70,fy-5,4,1,'#555')}
    if(d==='crystal'){for(i=0;i<8;i++){xx=4+i*12;var cc=6+Math.floor(R()*10);P(xx,fy-cc,3,cc,sc.acc);P(xx+1,fy-cc,1,cc-2,sc.glow);P(xx+3,fy-cc/2,2,cc/2,'#8a5ac0')}}
    if(d==='water'){P(0,fy-2,W,8,'#2a7ac0');for(i=0;i<20;i++)P(Math.floor(R()*W),fy-2+Math.floor(R()*5),4,1,'#6ab4f0');for(i=0;i<5;i++){xx=8+i*20;P(xx,3,2,4,'#bfe0ff');P(xx,7,1,1,'#bfe0ff')}}
    if(d==='fields'){P(78,2,8,8,'#fff6a0');P(79,1,6,10,'#fff6a0');for(i=0;i<6;i++){xx=6+i*14;P(xx,fy-4,2,4,'#e8c14a');P(xx+4,fy-5,2,5,'#e8c14a');P(xx+8,fy-3,2,3,'#d9a82a')}for(i=0;i<3;i++)P(10+i*30,4+i*2,12,3,'#fff')}
    if(d==='island'){P(26,12,44,4,'#5aa63a');P(30,16,36,3,'#7a5230');P(36,19,24,2,'#6a4426');P(44,21,8,2,'#6a4426');P(46,5,3,7,'#7a5230');P(41,1,13,5,'#3f8a2a');P(8,4,14,3,'#fff');P(72,8,14,3,'#fff')}
    if(d==='night'){P(76,3,6,6,'#f0ecc0');P(78,2,2,8,'#f0ecc0');for(i=0;i<26;i++)P(Math.floor(R()*W),Math.floor(R()*14),1,1,'#fff');P(20,fy-4,14,4,'#c0392b');P(20,fy-7,5,3,'#f0f0f0');P(20,fy,2,2,'#5e3a18');P(32,fy,2,2,'#5e3a18')}
    if(d==='slots'){for(i=0;i<3;i++){xx=24+i*18;P(xx,4,14,14,'#f4f4f4');P(xx+1,5,12,12,'#fff');P(xx+3,7,8,2,'#c0392b');P(xx+8,9,3,2,'#c0392b');P(xx+6,11,3,2,'#c0392b');P(xx+5,13,3,2,'#c0392b')}for(i=0;i<12;i++)P(4+i*8,1,2,2,i&1?'#ffcc33':'#fff')}
    if(d==='rod'){P(60,2,1,12,'#e8e8e8');P(52,2,9,1,'#8a5a2b');P(59,14,3,3,'#c0392b');P(59,14,3,1,'#fff');for(i=0;i<16;i++)P(Math.floor(R()*W),fy+Math.floor(R()*6),4,1,'#6ab4f0');P(30,fy+1,8,3,'#e07a3a');P(37,fy,3,5,'#e07a3a')}
  }
  function paintBanner(host,key){var cv=document.createElement('canvas');cv.className='banner';scene(cv,key);host.appendChild(cv)}
  function paintSpec(host,spec){var cv=document.createElement('canvas');cv.width=16;cv.height=16;var cx=cv.getContext('2d'),g=sprite(spec);
    for(var y=0;y<16;y++)for(var x=0;x<16;x++)if(g[y][x]){cx.fillStyle=g[y][x];cx.fillRect(x,y,1,1)}host.appendChild(cv)}
  function paint(el){
    var t=TIPS[el.dataset.t];if(!t)return;
    var cv=document.createElement('canvas');cv.width=16;cv.height=16;
    var cx=cv.getContext('2d'),g=sprite(t.i);
    for(var y=0;y<16;y++)for(var x=0;x<16;x++)if(g[y][x]){cx.fillStyle=g[y][x];cx.fillRect(x,y,1,1)}
    el.appendChild(cv);el.tabIndex=0;el.setAttribute('role','button');el.setAttribute('aria-label',t.n+' 설명 보기');
    el.addEventListener('mouseenter',function(){if(!pinned)showTip(el)});
    el.addEventListener('mouseleave',function(){if(!pinned)hideTip()});
    el.addEventListener('focus',function(){showTip(el)});
    el.addEventListener('blur',function(){if(pinned!==el)hideTip()});
    el.addEventListener('click',function(e){e.stopPropagation();if(pinned===el){pinned=null;hideTip()}else{pinned=el;showTip(el)}});
  }
  document.addEventListener('click',function(){pinned=null;hideTip()});
  window.addEventListener('scroll',function(){pinned=null;hideTip()},{passive:true});
  var tree=document.getElementById('tree'),main=document.getElementById('main'),nav=document.getElementById('nav');
  var byCat={};Object.keys(P).forEach(function(s){(byCat[P[s].c]=byCat[P[s].c]||[]).push(s)});
  function buildTree(){
    tree.innerHTML='';
    order.forEach(function(c){
      var d=document.createElement('details');d.dataset.c=c;
      if(P[cur]&&P[cur].c===c)d.open=true;
      var sm=document.createElement('summary');sm.textContent=c+' ('+byCat[c].length+')';d.appendChild(sm);
      var lastG=null;
      byCat[c].forEach(function(s){var gg=P[s].g||'';if(gg&&gg!==lastG){var sh=document.createElement('div');sh.className='sub';sh.textContent=gg;d.appendChild(sh)}lastG=gg;var a=document.createElement('a');a.href='#'+s;if(P[s].im){var ic=document.createElement('span');ic.className='ti';paintSpec(ic,P[s].im);a.appendChild(ic)}a.appendChild(document.createTextNode(P[s].t));if(s===cur)a.className='on';d.appendChild(a)});
      tree.appendChild(d);
    });
  }
  var hist=[],goingBack=false;
  function render(){
    var h=(location.hash||'').replace('#','');
    if(!P[h])h='home';
    var dir='fwd';
    if(cur&&cur!==h){if(goingBack){dir='bwd'}else{hist.push(cur)}}
    goingBack=false;
    cur=h;var p=P[h];
    document.title=(h==='home'?'':p.t+' - ')+'나오 서버 위키';
    var html='<div class="crumb"><a href="#home">위키</a> › '+p.c+'</div><h1>'+p.t+'</h1>'+p.h;
    var b=back[h];
    if(b&&b.length){
      html+='<div class="back"><b>이 문서를 링크한 문서</b><br>'+b.slice(0,40).map(function(s){return '<a href="#'+s+'">'+P[s].t+'</a>'}).join('')+'</div>';
    }
    if(p.b&&p.b!=='tint')html='<div class="bn"></div>'+html;
    main.innerHTML=html;
    main.classList.remove('enter','fwd','bwd');void main.offsetWidth;
    [].forEach.call(main.children,function(c,i){c.style.setProperty('--i',Math.min(i,10))});
    main.classList.add('enter',dir);
    var pg=document.getElementById('prog');pg.classList.remove('go');void pg.offsetWidth;pg.classList.add('go');
    updBack();
    var bn=main.querySelector('.bn');if(bn)paintBanner(bn,p.b);
    [].forEach.call(main.querySelectorAll('.ico'),paint);
    /* 하이퍼링크 앞에 아이콘 */
    [].forEach.call(main.querySelectorAll('a[href^="#"]'),function(a){
      if(a.closest('.crumb'))return;
      var sl=a.getAttribute('href').slice(1),pp=P[sl];if(!pp)return;
      var prev=a.previousElementSibling;if(prev&&(prev.classList.contains('ico')||prev.classList.contains('ti')))return;
      var sp=document.createElement('span');
      if(pp.tk&&TIPS[pp.tk]){sp.className='ico';sp.dataset.t=pp.tk;a.parentNode.insertBefore(sp,a);paint(sp)}
      else if(pp.im){sp.className='ti';paintSpec(sp,pp.im);a.parentNode.insertBefore(sp,a)}
    });
    /* 목차 */
    var hs=[].slice.call(main.querySelectorAll('h3'));
    var h1=main.querySelector('h1');
    var extra='';
    if(main.querySelector('.ico:not(.big)')||main.querySelector('.ico.big'))extra+='<div class="iconnote">아이콘에 마우스를 올리거나 누르면 아이템·몹 설명이 떠요. 아이콘은 코드로 그린 도트 그림이고 게임 원본 이미지는 아니에요.</div>';
    if(hs.length>=4){
      extra+='<div class="toc"><b>목차</b>'+hs.map(function(h,i){h.id='h'+i;return '<a data-h="h'+i+'" href="javascript:void(0)">'+h.textContent+'</a>'}).join('')+'</div>';
    }
    if(extra)h1.insertAdjacentHTML('afterend',extra);
    [].forEach.call(main.querySelectorAll('.toc a'),function(a){a.addEventListener('click',function(){var t=document.getElementById(a.dataset.h);if(t)t.scrollIntoView({behavior:'smooth',block:'start'})})});
    /* 이전/다음 문서 */
    var list=byCat[p.c],ix=list.indexOf(h);
    if(list.length>1){
      var pv=list[ix-1],nx=list[ix+1];
      main.insertAdjacentHTML('beforeend','<div class="pn">'+(pv?'<a href="#'+pv+'">← '+P[pv].t+'</a>':'<span></span>')+(nx?'<a href="#'+nx+'">'+P[nx].t+' →</a>':'<span></span>')+'</div>');
    }
    window.scrollTo({top:0,behavior:'instant'});
    buildTree();
    var cq=document.getElementById('cq');
    if(cq){var rows=[].slice.call(main.querySelectorAll('table.t tr')).slice(1);
      cq.addEventListener('input',function(){var v=cq.value.trim().toLowerCase();rows.forEach(function(r){if(r.cells[0].tagName==='TD')r.hidden=!!v&&r.textContent.toLowerCase().indexOf(v)<0})})}
    var iq=document.getElementById('iq');
    if(iq){var lis=[].slice.call(main.querySelectorAll('li'));
      iq.addEventListener('input',function(){var v=iq.value.trim().toLowerCase();lis.forEach(function(l){l.hidden=!!v&&l.textContent.toLowerCase().indexOf(v)<0})})}
    nav.classList.remove('open');
  }
  var sq=document.getElementById('sq'),res=document.getElementById('res');
  sq.addEventListener('input',function(){
    var v=sq.value.trim().toLowerCase();res.innerHTML='';if(!v)return;
    var n=0;
    Object.keys(P).forEach(function(s){
      if(n>=12)return;
      if(P[s].t.toLowerCase().indexOf(v)>=0){n++;var li=document.createElement('li'),a=document.createElement('a');
        a.href='#'+s;a.textContent=P[s].t;var sm=document.createElement('small');sm.textContent=P[s].c;a.appendChild(sm);

  });
  var wrap=document.querySelector('.wrap'),rb=document.getElementById('railbtn');
  function setRail(c){wrap.classList.toggle('collapsed',c);rb.setAttribute('aria-expanded',!c);try{localStorage.setItem('naoRail',c?'1':'0')}catch(e){}}
  var saved=null;try{saved=localStorage.getItem('naoRail')}catch(e){}
  setRail(saved==='1');
  rb.addEventListener('click',function(){setRail(!wrap.classList.contains('collapsed'))});
  var tb=document.getElementById('topbtn'),bb=document.getElementById('backbtn');
  function updBack(){var l=hist[hist.length-1];if(l&&P[l]){document.getElementById('backtxt').textContent=P[l].t;bb.classList.add('show')}else bb.classList.remove('show')}
  bb.addEventListener('click',function(){var l=hist.pop();if(l&&P[l]){goingBack=true;location.hash='#'+l}updBack()});
  tb.addEventListener('click',function(){window.scrollTo({top:0,behavior:'smooth'})});
  window.addEventListener('scroll',function(){tb.classList.toggle('show',window.scrollY>320)},{passive:true});
  window.addEventListener('hashchange',render);
  render();
})();
